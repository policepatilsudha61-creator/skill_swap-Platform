<!DOCTYPE html><html>
<head>
    <title>Send Message</title><style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#4facfe,#00f2fe);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        width:600px;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 0 20px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#007bff;
        margin-bottom:20px;
    }

    textarea{
        width:100%;
        height:180px;
        padding:15px;
        border:2px solid #ddd;
        border-radius:10px;
        font-size:16px;
        resize:none;
    }

    textarea:focus{
        outline:none;
        border-color:#007bff;
    }

    .btn{
        width:100%;
        padding:12px;
        margin-top:15px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
    }

    .btn:hover{
        background:#0056b3;
    }

    .back{
        display:block;
        text-align:center;
        margin-top:15px;
        text-decoration:none;
        color:#007bff;
        font-weight:bold;
    }
</style>

</head>
<body><div class="container"><h1>💬 Send Message to {{ receiver }}</h1>

<form method="POST">

    <textarea
        name="message"
        placeholder="Type your message here..."
        required></textarea>

    <button type="submit" class="btn">
        Send Message
    </button>

</form>

<a href="/messages" class="back">
    View Messages
</a>

</div></body>
</html>
